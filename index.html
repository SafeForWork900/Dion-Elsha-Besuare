<!DOCTYPE html>
<html lang="id" data-theme="classic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Besuare — Dion &amp; Elsha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ============ BASE / TOKENS ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;padding:0;
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .8s ease,color .8s ease;
  position:relative;
}
:root{
  --bg:#FBF6EF;
  --bg-soft:#F3EBE0;
  --surface:#FFFFFF;
  --ink:#2B2422;
  --muted:#7C6A60;
  --accent:#8E2B39;
  --accent-soft:#B85462;
  --gold:#B08B3E;
  --line:rgba(43,36,34,.14);
  --shadow:0 24px 60px -30px rgba(43,36,34,.45);
  --disp:'Cormorant Garamond',serif;
}
html[data-theme="garden"]{--bg:#F5F7F1;--bg-soft:#E9EFE2;--surface:#FFFFFF;--ink:#22301F;--muted:#6B7C64;--accent:#3F6146;--accent-soft:#6E9172;--gold:#A9A05C;--line:rgba(34,48,31,.14)}
html[data-theme="ocean"]{--bg:#F1F6F7;--bg-soft:#E1ECF0;--surface:#FFFFFF;--ink:#102B33;--muted:#5C7A83;--accent:#0F4C5C;--accent-soft:#3D7C8C;--gold:#C08F4F}
html[data-theme="noir"]{--bg:#14110F;--bg-soft:#1E1A17;--surface:#1D1917;--ink:#EFE7D9;--muted:#9C9184;--accent:#C9A227;--accent-soft:#E4C873;--gold:#C9A227;--line:rgba(239,231,217,.16);--shadow:0 24px 60px -30px rgba(0,0,0,.9)}
html[data-theme="blush"]{--bg:#FDF6F2;--bg-soft:#F8E9E2;--surface:#FFFFFF;--ink:#3A2622;--muted:#94776E;--accent:#B9635C;--accent-soft:#D89A8F;--gold:#CBA35E}
html[data-theme="mono"]{--bg:#FFFFFF;--bg-soft:#F2F2F0;--surface:#FFFFFF;--ink:#141414;--muted:#767676;--accent:#141414;--accent-soft:#5A5A5A;--gold:#8E8E8E}

::selection{background:var(--accent);color:#fff}
img{max-width:100%;display:block}
button{font-family:inherit}
a{color:inherit}

/* ============ AMBIENT LAYERS ============ */
#petals{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.75}
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;
  background:linear-gradient(90deg,var(--accent),var(--gold));box-shadow:0 0 12px rgba(0,0,0,.15)}

/* ============ AMBIENT / SECTION LIVELINESS ============ */
.sec,.closing{
  background-image:
    radial-gradient(60% 55% at 8% 6%, color-mix(in srgb,var(--gold) 16%,transparent), transparent 60%),
    radial-gradient(55% 60% at 96% 94%, color-mix(in srgb,var(--accent) 12%,transparent), transparent 60%);
  background-repeat:no-repeat;
}
.sec.alt{
  background-color:var(--bg-soft);
  background-image:
    radial-gradient(60% 55% at 8% 6%, color-mix(in srgb,var(--gold) 20%,transparent), transparent 60%),
    radial-gradient(55% 60% at 96% 94%, color-mix(in srgb,var(--accent) 14%,transparent), transparent 60%);
}
.corner-orn{position:fixed;width:150px;height:150px;color:var(--gold);opacity:.35;z-index:1;pointer-events:none}
.corner-orn.tl{top:14px;left:14px}
.corner-orn.br{bottom:14px;right:14px;transform:rotate(180deg)}
@media(max-width:640px){.corner-orn{width:90px;height:90px}}

body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:var(--ambient-img,none);
  background-size:cover;background-position:center;
  opacity:.16;filter:saturate(.6) blur(.5px);
}
.sec-photo{position:relative;isolation:isolate}
.sec-photo::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(color-mix(in srgb,var(--bg) 55%,transparent),color-mix(in srgb,var(--bg) 55%,transparent)),var(--photo);
  background-size:cover;background-position:center;background-attachment:fixed;
}
.sec-photo.alt::before{
  background-image:linear-gradient(color-mix(in srgb,var(--bg-soft) 50%,transparent),color-mix(in srgb,var(--bg-soft) 50%,transparent)),var(--photo);
}
.closing.sec-photo::before{
  background-image:linear-gradient(color-mix(in srgb,var(--bg-soft) 55%,transparent),color-mix(in srgb,var(--bg-soft) 55%,transparent)),var(--photo);
}
.sec-photo>.wrap{position:relative;z-index:1}
.sec-photo .sec-head{
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(8px);border-radius:8px;padding:34px 26px;box-shadow:var(--shadow);
}
.sec-photo.alt .sec-head{background:color-mix(in srgb,var(--bg-soft) 84%,transparent)}
.closing.sec-photo .wrap>.eyebrow,.closing.sec-photo .wrap>h2,.closing.sec-photo .wrap>p,.closing.sec-photo .hashtag{
  position:relative;
}
.closing.sec-photo .wrap{
  background:color-mix(in srgb,var(--bg-soft) 78%,transparent);
  backdrop-filter:blur(8px);border-radius:10px;padding:56px 30px;max-width:640px;
}

/* ============ OPENING / ENVELOPE ============ */
.opening{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 120% at 50% 0%,var(--bg-soft),var(--bg) 60%);
  overflow:hidden;padding:24px;
  transition:opacity 1s ease,visibility 1s;
}
.opening.hide{opacity:0;visibility:hidden;pointer-events:none}
.opening::after{content:"";position:absolute;inset:-40%;
  background:conic-gradient(from 0deg,transparent 0 70%,rgba(176,139,62,.16) 80%,transparent 100%);
  animation:sweep 14s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.open-card{
  position:relative;z-index:2;max-width:460px;width:100%;text-align:center;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:52px 34px 40px;box-shadow:var(--shadow);
  animation:cardIn 1.1s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
.open-card .stamp{width:74px;height:74px;margin:0 auto 20px;color:var(--gold)}
.open-card .stamp circle,.open-card .stamp path{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 2.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.eyebrow{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);font-weight:600}
.open-card h1{font-family:var(--disp);font-weight:400;font-size:34px;line-height:1.15;margin:14px 0 6px;color:var(--accent)}
.open-card .to-line{font-size:13.5px;color:var(--muted);margin:18px 0 4px}
#guestInput{
  width:100%;text-align:center;font-family:var(--disp);font-size:22px;color:var(--ink);
  background:transparent;border:none;border-bottom:1px dashed var(--line);padding:6px 4px;margin:6px 0 4px;outline:none;
}
#guestInput:focus{border-bottom-color:var(--accent)}
.btn{
  position:relative;display:inline-flex;align-items:center;gap:10px;justify-content:center;
  padding:14px 30px;border:none;cursor:pointer;border-radius:2px;
  background:var(--accent);color:#fff;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;
  overflow:hidden;transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s;
}
.btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transition:left .7s ease}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px var(--accent)}
.btn:hover::after{left:130%}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:10px 18px;font-size:10.5px;letter-spacing:.16em}

/* ============ MUSIC BUTTON ============ */
.music-btn{
  position:fixed;right:18px;bottom:18px;z-index:70;width:52px;height:52px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;
  display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .4s
}
.music-btn:hover{transform:scale(1.08)}
.music-btn.playing{animation:spinSlow 9s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.music-btn svg{width:22px;height:22px}
.eq{display:flex;gap:2.5px;align-items:flex-end;height:16px;position:absolute;bottom:-16px;opacity:0;transition:opacity .3s}
.music-btn.playing .eq{opacity:1}
.eq i{width:2.5px;background:var(--accent);height:5px;border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:15px}}

/* ============ HERO ============ */
.hero{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;text-align:center;padding:90px 20px 70px}
.hero-bg{position:absolute;inset:-8% 0 0;background-size:cover;background-position:center;will-change:transform}
.hero::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.2) 40%,var(--bg) 97%)}
html[data-theme="noir"] .hero::before{background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.45) 40%,var(--bg) 97%)}
.hero-spot{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .6s;
  background:radial-gradient(220px 220px at var(--mx,50%) var(--my,50%),rgba(255,255,255,.18),transparent 70%);mix-blend-mode:screen}
.hero:hover .hero-spot{opacity:1}
.hero-inner{position:relative;z-index:3;color:#fff;max-width:900px}
html[data-theme="noir"] .hero-inner{color:#F3ECE0}
.hero-inner .eyebrow{color:rgba(255,255,255,.82)}
.hero-names{font-family:var(--disp);font-weight:300;line-height:1;margin:22px 0 6px;
  font-size:clamp(48px,11vw,124px);text-shadow:0 12px 40px rgba(0,0,0,.35)}
.hero-names .amp{display:block;font-style:italic;font-size:.42em;color:var(--gold);margin:6px 0;opacity:0}
.ltr{display:inline-block;opacity:0;transform:translateY(.9em) rotate(4deg)}
body.opened .ltr{animation:ltrIn .95s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i)*.055s + .25s)}
@keyframes ltrIn{to{opacity:1;transform:none}}
.hero-date{font-size:13px;letter-spacing:.34em;text-transform:uppercase;margin-top:26px;opacity:0;
  animation:fadeUp 1s ease forwards;animation-delay:1.1s}
.hero-orn{width:min(320px,70vw);margin:26px auto 0;color:var(--gold);opacity:0;animation:fadeUp 1.2s ease forwards;animation-delay:1.25s}
.hero-orn path{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.6s ease 1.3s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.scroll-cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:4;color:#fff;opacity:0;
  animation:fadeUp 1s ease 1.7s forwards;display:grid;justify-items:center;gap:8px;font-size:10px;letter-spacing:.3em;text-transform:uppercase}
.scroll-cue span.bar{width:1px;height:44px;background:linear-gradient(#fff,transparent);animation:cue 2.2s ease-in-out infinite}
@keyframes cue{0%,100%{transform:scaleY(.4);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}

/* ============ SECTIONS ============ */
section{position:relative;z-index:3}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.sec{padding:96px 0}
.sec.alt{background:var(--bg-soft)}
.sec-head{text-align:center;margin-bottom:56px}
.sec-head .eyebrow{color:var(--accent)}
.sec-title{font-family:var(--disp);font-weight:400;font-size:clamp(32px,5vw,50px);margin:12px 0 0;line-height:1.1}
.rule{width:78px;height:1px;background:var(--accent);margin:18px auto 0;position:relative;overflow:hidden}
.rule::after{content:"";position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .9s ease .2s}
.in .rule::after{transform:scaleX(1)}
.sec-head p{color:var(--muted);max-width:620px;margin:16px auto 0;font-size:15px;line-height:1.8}

[data-reveal]{opacity:0;transform:translateY(34px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0s)}
[data-reveal].in{opacity:1;transform:none}
[data-reveal="zoom"]{transform:scale(.94)}
[data-reveal="left"]{transform:translateX(-40px)}
[data-reveal="right"]{transform:translateX(40px)}

/* quote */
.quote{text-align:center;max-width:760px;margin:0 auto}
.quote blockquote{font-family:var(--disp);font-style:italic;font-size:clamp(21px,3.2vw,30px);line-height:1.6;margin:0;color:var(--ink)}
.quote .src{margin-top:22px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}

/* countdown */
.count{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.count .unit{min-width:96px;background:var(--surface);border:1px solid var(--line);padding:20px 10px;border-radius:3px;box-shadow:var(--shadow)}
.count .n{font-family:var(--disp);font-size:44px;line-height:1;color:var(--accent);display:block;transition:transform .5s cubic-bezier(.16,1,.3,1),filter .5s}
.count .n.tick{transform:translateY(-6px) scale(1.06);filter:blur(.4px)}
.count .l{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-top:10px;display:block}

/* couple */
.couple{display:grid;grid-template-columns:1fr auto 1fr;gap:34px;align-items:center}
.person{text-align:center}
.pframe{position:relative;width:min(260px,70vw);margin:0 auto 22px;aspect-ratio:3/4;overflow:hidden;border-radius:180px 180px 6px 6px;background:var(--bg-soft)}
.pframe img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 1.4s cubic-bezier(.16,1,.3,1);filter:saturate(.95)}
.pframe.in img{transform:scale(1)}
.pframe::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.42));opacity:.9}
.pframe .mask{position:absolute;inset:0;background:var(--bg-soft);transform-origin:bottom;transition:transform 1.1s cubic-bezier(.76,0,.24,1)}
.pframe.in .mask{transform:scaleY(0)}
.person h3{font-family:var(--disp);font-size:32px;font-weight:400;margin:0 0 4px;color:var(--accent)}
.person .parents{color:var(--muted);font-size:13.5px;line-height:1.7}
.person .soc{display:inline-flex;gap:8px;margin-top:14px;align-items:center;font-size:12px;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}
.ampersand{font-family:var(--disp);font-style:italic;font-size:60px;color:var(--gold);opacity:.9}

/* events */
.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.ecard{background:var(--surface);border:1px solid var(--line);padding:40px 30px;text-align:center;position:relative;overflow:hidden;border-radius:3px;box-shadow:var(--shadow)}
.ecard::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);pointer-events:none;opacity:.5}
.ecard .ico{width:40px;height:40px;margin:0 auto 16px;color:var(--accent)}
.ecard h4{font-family:var(--disp);font-size:28px;font-weight:400;margin:0 0 14px;color:var(--accent)}
.ecard .row{font-size:14px;color:var(--muted);line-height:1.9}
.ecard .row b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.ecard .btn{margin-top:22px}

/* timeline */
.tl{position:relative;max-width:760px;margin:0 auto;padding-left:44px}
.tl-svg{position:absolute;left:12px;top:0;height:100%;width:24px;overflow:visible}
.tl-svg path{fill:none;stroke:var(--gold);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;opacity:.9}
.tl-item{position:relative;padding:0 0 54px}
.tl-item::before{content:"";position:absolute;left:-38px;top:6px;width:13px;height:13px;border-radius:50%;
  background:var(--bg);border:2px solid var(--accent);transition:transform .5s,background .5s}
.tl-item.in::before{background:var(--accent);transform:scale(1.15)}
.tl-item .date{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:600}
.tl-item h4{font-family:var(--disp);font-size:26px;font-weight:400;margin:8px 0 8px;color:var(--accent)}
.tl-item p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.85}

/* gallery */
.gal{columns:3;column-gap:14px}
.gal figure{margin:0 0 14px;break-inside:avoid;overflow:hidden;border-radius:3px;cursor:pointer;position:relative;
  clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.76,0,.24,1)}
.gal figure.in{clip-path:inset(0 0 0 0)}
.gal img{width:100%;transition:transform 1s cubic-bezier(.16,1,.3,1),filter .6s}
.gal figure:hover img{transform:scale(1.07)}
.gal figure::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.35),transparent 55%);opacity:0;transition:opacity .5s}
.gal figure:hover::after{opacity:1}

/* rsvp + wishes */
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);padding:34px;border-radius:3px;box-shadow:var(--shadow)}
.panel h4{font-family:var(--disp);font-size:28px;font-weight:400;margin:0 0 6px;color:var(--accent)}
.panel p.sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{
  width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:2px;font-size:14px;font-family:inherit;outline:none;transition:border-color .3s,box-shadow .3s,background .3s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
textarea{resize:vertical;min-height:92px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{flex:1;min-width:110px;padding:13px;border:1px solid var(--line);background:var(--bg);cursor:pointer;border-radius:2px;
  font-size:13px;text-align:center;transition:.3s;color:var(--muted)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.wish-list{max-height:340px;overflow-y:auto;display:grid;gap:14px;padding-right:6px}
.wish{border-left:2px solid var(--gold);padding:2px 0 2px 16px;animation:wishIn .6s cubic-bezier(.16,1,.3,1) both}
@keyframes wishIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.wish .n{font-weight:600;font-size:14px;color:var(--accent)}
.wish .t{font-size:11px;color:var(--muted);margin-left:8px}
.wish p{margin:5px 0 0;font-size:14px;color:var(--muted);line-height:1.7}
.stats{display:flex;gap:18px;justify-content:center;margin-top:40px;flex-wrap:wrap}
.stat{min-width:130px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:38px;color:var(--accent);line-height:1}
.stat span{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:8px;display:block}

/* gift / tanda kasih */
.gift-card{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:30px 26px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.gift-card::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);pointer-events:none;opacity:.5}
.gift-card h4{font-family:var(--disp);font-weight:400;font-size:22px;margin:0 0 12px;color:var(--accent)}
.gift-card .num{font-family:var(--disp);font-size:26px;letter-spacing:.03em;color:var(--ink);margin-bottom:4px}
.gift-card .holder{font-size:12.5px;color:var(--muted);margin-bottom:18px;text-transform:uppercase;letter-spacing:.12em}

/* turut mengundang */
.coinv{max-width:640px;margin:0 auto;columns:2;column-gap:34px}
.coinv-item{break-inside:avoid;color:var(--muted);font-size:14.5px;line-height:2.1}
.coinv-item b{color:var(--ink);font-weight:600}
@media(max-width:560px){.coinv{columns:1}}

/* closing */
.closing{text-align:center;padding:110px 0 90px;background:var(--bg-soft);position:relative;overflow:hidden}
.closing .glow{position:absolute;width:620px;height:620px;left:50%;top:40%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,color-mix(in srgb,var(--gold) 26%,transparent),transparent 62%);pointer-events:none;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}

   ==================================================================== */
const DEFAULT = {

/* ================= MUSIC ENGINE ================= */
const Music={
  ctx:null,master:null,timer:null,step:0,playing:false,mode:'synth',
  chords:[[57,64,69,73],[53,60,65,69],[55,62,67,71],[50,57,62,65]],
  init(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    this.ctx=new AC();
    this.master=this.ctx.createGain(); this.master.gain.value=0; this.master.connect(this.ctx.destination);
    this.delay=this.ctx.createDelay(1.2); this.delay.delayTime.value=.42;
    const fb=this.ctx.createGain(); fb.gain.value=.34;
    const wet=this.ctx.createGain(); wet.gain.value=.45;
    this.delay.connect(fb); fb.connect(this.delay); this.delay.connect(wet); wet.connect(this.master);
  },
  note(midi,time,dur,gain,type){
    const f=440*Math.pow(2,(midi-69)/12);
    const o=this.ctx.createOscillator(); o.type=type||'sine'; o.frequency.value=f;
    const g=this.ctx.createGain();
    const lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200;
    g.gain.setValueAtTime(0,time);
    g.gain.linearRampToValueAtTime(gain,time+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,time+dur);
    o.connect(lp); lp.connect(g); g.connect(this.master); g.connect(this.delay);
    o.start(time); o.stop(time+dur+0.05);
  },
  schedule(){
    if(!this.ctx)return;
    const t0=this.ctx.currentTime+0.06;
    const ch=this.chords[this.step%this.chords.length];
    const seq=[0,2,1,3,2,1,0,2];
    for(let i=0;i<8;i++){
      const m=ch[seq[i]]+((this.step>=2&&this.step%4===3)?12:0);
      this.note(m,t0+i*0.36,1.5,0.055,i%3===0?'triangle':'sine');
    }
    if(this.step%4===0) this.note(ch[0]-12,t0,3.2,0.07,'sine');
    if(this.step%8===0) this.note(ch[2]+12,t0,2.4,0.03,'sine');
    this.step++;
  },
  start(){
    const url=(state.data.music&&state.data.music.url||'').trim();
    if(url){
      const a=document.getElementById('customAudio');
      if(a.getAttribute('src')!==url){a.src=url}
      a.volume=Math.min(1,parseFloat(state.data.music.vol)||0.6);
      a.play().then(()=>{this.playing=true;syncMusicUI()}).catch(()=>{toast('Audio tidak dapat diputar. Menggunakan musik bawaan.');this.playing=false});
      return;
    }
    this.init(); if(!this.ctx){toast('Peramban tidak mendukung audio.');return}
    if(this.ctx.state==='suspended')this.ctx.resume();
    const vol=Math.min(1,parseFloat(state.data.music&&state.data.music.vol)||0.55);
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.linearRampToValueAtTime(vol,this.ctx.currentTime+1.2);
    if(!this.timer){this.schedule();this.timer=setInterval(()=>this.schedule(),2880);}
    this.playing=true; syncMusicUI();
  },
  stop(){
    document.getElementById('customAudio').pause();
    if(this.ctx&&this.master){this.master.gain.cancelScheduledValues(this.ctx.currentTime);this.master.gain.linearRampToValueAtTime(0,this.ctx.currentTime+.5)}
    if(this.timer){clearInterval(this.timer);this.timer=null;this.step=0}
    this.playing=false; syncMusicUI();
  },
  toggle(){this.playing?this.stop():this.start()}
};

function fmtDate(d,t){

function fmtDay(d,t){

function target(d,t){
  if(!d)return new Date(NaN);
  const p=d.split('-').map(Number); const q=(t||'00:00').split(':').map(Number);
  return new Date(p[0],p[1]-1,p[2],q[0]||0,q[1]||0);

          <div class="field"><label>Nama</label><input type="text" id="rName" value="${esc(guestName)}" placeholder="Nama lengkap"></div>
          <div class="field"><label>Kehadiran</label>

          <button class="btn ghost" onclick="submitWish()">Kirim Ucapan</button>

      <div class="stats" data-reveal>

        <div class="stat"><b data-count="${getL(wKey()).length}">0</b><span>Ucapan &amp; Doa</span></div>
        <div class="stat"><b data-count="${(d.coInvite&&d.coInvite.length)||0}">0</b><span>Keluarga Turut Mengundang</span></div>
      </div>
    </div>
  </section>

  ${(d.gift.bankAccount||d.gift.ewalletNumber)?`<section class="sec alt sec-photo" style="--photo:url('${esc(at.gift||'')}')">
    <div class="wrap">
      <div class="sec-head" data-reveal>
        <div class="eyebrow">Tanpa Mengurangi Rasa Hormat</div>
        <h2 class="sec-title">Tanda Kasih</h2>
        <div class="rule"></div>
        <p>${esc(d.gift.note)}</p>
      </div>
      <div class="agrid" style="max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px">
        ${d.gift.bankAccount?`<div class="gift-card" data-reveal="left">
          <h4>${esc(d.gift.bankName)}</h4>
          <div class="num">${esc(d.gift.bankAccount)}</div>

          <button class="btn ghost small" onclick="copy('${esc(d.gift.bankAccount).replace(/'/g,"\\'")}','Nomor rekening tersalin.')">Salin Nomor</button>

        ${d.gift.ewalletNumber?`<div class="gift-card" data-reveal="right">
          <h4>${esc(d.gift.ewalletName)}</h4>
          <div class="num">${esc(d.gift.ewalletNumber)}</div>
          <div class="holder">a.n. ${esc(d.gift.ewalletHolder)}</div>
          <button class="btn ghost small" onclick="copy('${esc(d.gift.ewalletNumber).replace(/'/g,"\\'")}','Nomor tersalin.')">Salin Nomor</button>

      </div>
      ${d.gift.address&&d.gift.address.trim()?`<p style="text-align:center;color:var(--muted);margin-top:34px;font-size:13.5px;line-height:1.8">Atau kirim kado ke alamat berikut:<br>${esc(d.gift.address)}</p>`:''}

  <section class="closing sec-photo" style="--photo:url('${esc(at.closing||'')}')">

/* ================= THEME ================= */
function applyTheme(){
  const root=document.documentElement;
  root.setAttribute('data-theme',state.data.theme||'classic');
  root.style.removeProperty('--accent');root.style.removeProperty('--gold');
  if(state.data.themeAccent)root.style.setProperty('--accent',state.data.themeAccent);
  if(state.data.themeGold)root.style.setProperty('--gold',state.data.themeGold);
  const amb=(state.data.atmosphere&&state.data.atmosphere.ambient)||state.data.cover.image;
  root.style.setProperty('--ambient-img',`url('${amb}')`);
  setPetalColors();
}

/* ================= REVEAL OBSERVER ================= */
let io;
function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); if(e.target.dataset.count!==undefined)countUp(e.target);} });
  },{threshold:.16,rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('[data-reveal],.pframe,.gal figure,.tl-item,.stat').forEach(el=>io.observe(el));
  buildTimelinePath();
}
function countUp(el){
  const end=+el.dataset.count||0; let t0=null;
  function step(t){ if(!t0)t0=t; const p=Math.min(1,(t-t0)/1200);
    el.textContent=Math.round(end*(1-Math.pow(1-p,3))); if(p<1)requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
/* timeline path drawing linked to scroll */
function buildTimelinePath(){
  const tl=document.getElementById('timeline'), svg=document.getElementById('tlSvg'), path=document.getElementById('tlPath');
  if(!tl||!svg||!path)return;
  const h=tl.offsetHeight; svg.setAttribute('viewBox','0 0 24 '+h); svg.setAttribute('height',h);
  path.setAttribute('d','M12 0 L12 '+h);
  const len=h; path.style.strokeDasharray=len; path.style.strokeDashoffset=len; path._len=len;
}
function onScroll(){
  const sc=window.scrollY, dh=document.documentElement.scrollHeight-window.innerHeight;
  document.getElementById('progress').style.width=(dh>0?(sc/dh*100):0)+'%';
  const hb=document.getElementById('heroBg');
  if(hb&&sc<window.innerHeight*1.2) hb.style.transform='translate3d(0,'+(sc*0.32)+'px,0) scale(1.06)';
  const path=document.getElementById('tlPath'), tl=document.getElementById('timeline');
  if(path&&tl){
    const r=tl.getBoundingClientRect();
    const p=Math.min(1,Math.max(0,(window.innerHeight*0.85-r.top)/(r.height*0.9)));
    path.style.strokeDashoffset=path._len*(1-p);
  }
}
window.addEventListener('scroll',()=>requestAnimationFrame(onScroll),{passive:true});
window.addEventListener('resize',()=>{buildTimelinePath();onScroll()});

/* hero spotlight */
document.addEventListener('mousemove',e=>{
  const h=document.getElementById('hero'); if(!h)return;
  const r=h.getBoundingClientRect();
  if(e.clientY<r.bottom){const s=document.getElementById('heroSpot');
    s.style.setProperty('--mx',(e.clientX-r.left)+'px'); s.style.setProperty('--my',(e.clientY-r.top)+'px');}
});

/* ================= COUNTDOWN ================= */
let cdTimer;
function startCountdown(){
  clearInterval(cdTimer);
  const tgt=target(state.data.event.recDate,state.data.event.recTime);
  const set=(id,v)=>{const el=document.getElementById(id);if(!el)return;if(el.textContent!==v){el.textContent=v;el.classList.add('tick');setTimeout(()=>el.classList.remove('tick'),420)}};
  function tick(){
    const diff=tgt-new Date();
    if(diff<=0){['d','h','m','s'].forEach(k=>set('cd-'+k,'00'));
      const n=document.getElementById('cdNote'); if(n)n.textContent='Alhamdulillah, hari bahagia telah tiba.'; return;}
    const s=Math.floor(diff/1000);
    set('cd-d',String(Math.floor(s/86400)).padStart(2,'0'));
    set('cd-h',String(Math.floor(s%86400/3600)).padStart(2,'0'));
    set('cd-m',String(Math.floor(s%3600/60)).padStart(2,'0'));
    set('cd-s',String(s%60).padStart(2,'0'));
  }
  tick(); cdTimer=setInterval(tick,1000);
}

/* ================= WISHES / RSVP =================
   Catatan: karena situs ini berjalan tanpa server (tanpa database),
   RSVP & ucapan disimpan di localStorage perangkat masing-masing
   tamu, dan ucapan yang terkirim langsung tampil di Buku Tamu untuk
   semua pengunjung yang membuka tautan yang sama dari perangkat itu.
   Untuk mengumpulkan RSVP semua tamu di satu tempat, dibutuhkan
   layanan formulir eksternal (Google Form, dsb.) — di luar cakupan
   berkas satu-file ini. */
let attVal='Hadir';
function bindAttChips(){
  document.querySelectorAll('#attChips .chip').forEach(c=>c.onclick=()=>{
    document.querySelectorAll('#attChips .chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active'); attVal=c.dataset.v;});
}
function renderWishes(){
  const box=document.getElementById('wishList'); if(!box)return;
  const list=getL(wKey());
  box.innerHTML=list.length?list.map(w=>`<div class="wish"><span class="n">${esc(w.name)}</span><span class="t">${esc(w.time)}</span><p>${esc(w.msg)}</p></div>`).join('')
    :`<p style="color:var(--muted);font-size:13.5px">Jadilah yang pertama mengirimkan ucapan.</p>`;
}
function submitWish(){
  const n=document.getElementById('wName').value.trim(), m=document.getElementById('wMsg').value.trim();
  if(!n||!m){toast('Nama dan ucapan wajib diisi.');return}
  const l=getL(wKey()); l.unshift({name:n,msg:m,time:new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date())});
  setL(wKey(),l.slice(0,120)); document.getElementById('wMsg').value=''; renderWishes(); toast('Terima kasih atas doanya!');
}
function submitRsvp(){
  const n=document.getElementById('rName').value.trim(); if(!n){toast('Mohon isi nama Anda.');return}
  const c=Math.max(1,Math.min(20,+document.getElementById('rCount').value||1));
  const l=getL(rKey()).filter(x=>x.name!==n);
  l.unshift({name:n,att:attVal,count:attVal==='Hadir'?c:0,time:Date.now()});
  setL(rKey(),l.slice(0,200)); toast('Konfirmasi terkirim. Terima kasih!');
  const st=document.querySelectorAll('.stat b[data-count]'); if(st[0])st[0].dataset.count=l.reduce((a,b)=>a+(+b.count||0),0),countUp(st[0]);
}
function addToCal(kind){
  const d=state.data.event;
  const date=kind==='akad'?d.akadDate:d.recDate, time=kind==='akad'?d.akadTime:d.recTime;
  const t=target(date,time); const end=new Date(t.getTime()+3*3600*1000);
  const f=x=>x.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Wedding//ID','BEGIN:VEVENT','DTSTART:'+f(t),'DTEND:'+f(end),
    'SUMMARY:'+(kind==='akad'?'Akad Nikah ':'Resepsi ')+state.data.groom.nick+' & '+state.data.bride.nick,
    'LOCATION:'+d.address,'DESCRIPTION:'+d.recVenue,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  const a=document.createElement('a'); a.href=url; a.download='undangan.ics'; a.click(); URL.revokeObjectURL(url);
  toast('Kalender diunduh.');
}
function copy(txt,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(()=>fallback())}
  else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg)}catch(e){toast('Gagal menyalin')}ta.remove()}
}

/* ================= LIGHTBOX ================= */
function openLB(src){document.getElementById('lbImg').src=src;document.getElementById('lb').classList.add('on');document.body.style.overflow='hidden'}
document.getElementById('lbClose').onclick=closeLB;
document.getElementById('lb').onclick=e=>{if(e.target.id==='lb')closeLB()};
function closeLB(){document.getElementById('lb').classList.remove('on');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLB();}});

/* ================= PETALS ================= */
const cvs=document.getElementById('petals'),ctx=cvs.getContext('2d');
let petals=[],cols=['#B85462','#C9A227'];
function setPetalColors(){
  const s=getComputedStyle(document.documentElement);
  cols=[s.getPropertyValue('--accent-soft').trim()||'#B85462',s.getPropertyValue('--gold').trim()||'#C9A227',s.getPropertyValue('--accent').trim()||'#8E2B39'];
}
function sizeCanvas(){cvs.width=innerWidth;cvs.height=innerHeight}
sizeCanvas(); addEventListener('resize',()=>{sizeCanvas();initPetals()});
function initPetals(){
  const n=innerWidth<640?14:26;
  petals=Array.from({length:n},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    r:2+Math.random()*4.5,sp:.18+Math.random()*.55,dx:(Math.random()-.5)*.35,
    a:Math.random()*Math.PI,va:(Math.random()-.5)*.02,o:.14+Math.random()*.35,
    c:cols[Math.floor(Math.random()*cols.length)]}));
}
initPetals();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  if(!reduce)petals.forEach(p=>{
    p.y+=p.sp; p.x+=p.dx+Math.sin(p.y/70)*.35; p.a+=p.va;
    if(p.y>cvs.height+12){p.y=-12;p.x=Math.random()*cvs.width}
    if(p.x<-12)p.x=cvs.width+12; if(p.x>cvs.width+12)p.x=-12;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=p.o;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*1.9,0,0,Math.PI*2);ctx.fill();ctx.restore();
  });
  requestAnimationFrame(loop);
}
loop();

/* ================= OPENING ================= */
document.getElementById('openBtn').onclick=()=>{
  const v=document.getElementById('guestInput').value.trim();
  if(v)guestName=v;
  document.getElementById('opening').classList.add('hide');
  document.body.classList.add('opened');
  document.body.style.overflow='';
  setTimeout(()=>{Music.start();},450);
  if(guestName){const r=document.getElementById('rName'),w=document.getElementById('wName');if(r)r.value=guestName;if(w)w.value=guestName;}
};
document.getElementById('musicBtn').onclick=()=>Music.toggle();

document.body.style.overflow='hidden';
readHash();
renderInvitation();
onScroll();
setPetalColors();
if(guestName)document.getElementById('guestInput').value=guestName;
setTimeout(()=>{document.getElementById('guestInput').focus({preventScroll:true})},700);
window.addEventListener('hashchange',()=>{readHash();renderInvitation();onScroll()});
</script>
